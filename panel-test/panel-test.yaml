substitutions:
  name: panel-test
  friendly_name: "Panel Test"
  rotation: "0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  hardware: github://agillis/esphome-modular-lvgl-buttons/hardware/waveshare-esp32-s3-touch-lcd-7.yaml@main

logger:

api:
  encryption:
    key: !secret panel_test_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.99.152
  ap:
    ssid: "Panel-Test Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto t = id(ha_time).now();
            int h = t.hour % 12; if (h == 0) h = 12;
            char buf[12];
            snprintf(buf, sizeof(buf), "%d:%02d %s", h, t.minute, t.hour < 12 ? "AM" : "PM");
            return std::string(buf);
      - lvgl.label.update:
          id: clock_label_b1
          text: !lambda |-
            auto t = id(ha_time).now();
            int h = t.hour % 12; if (h == 0) h = 12;
            char buf[12];
            snprintf(buf, sizeof(buf), "%d:%02d %s", h, t.minute, t.hour < 12 ? "AM" : "PM");
            return std::string(buf);

sensor:
  - platform: homeassistant
    id: floors_supply
    entity_id: sensor.mechanical_room_heating_zones_sensors_ee9780_bathrooms_kitchen_floors_supply
    on_value:
      - lvgl.indicator.update:
          id: n_floors_supply
          value: !lambda return x;
      - lvgl.label.update:
          id: v_floors_supply
          text: !lambda return str_sprintf("%.1f°F", x);

  - platform: homeassistant
    id: floors_mix
    entity_id: sensor.mechanical_room_heating_zones_sensors_ee9780_bathrooms_kitchen_floors_mix
    on_value:
      - lvgl.indicator.update:
          id: n_floors_mix
          value: !lambda return x;
      - lvgl.label.update:
          id: v_floors_mix
          text: !lambda return str_sprintf("%.1f°F", x);

  - platform: homeassistant
    id: floors_return
    entity_id: sensor.mechanical_room_heating_zones_sensors_ee9780_bathrooms_kitchen_floors_return
    on_value:
      - lvgl.indicator.update:
          id: n_floors_return
          value: !lambda return x;
      - lvgl.label.update:
          id: v_floors_return
          text: !lambda return str_sprintf("%.1f°F", x);

  - platform: homeassistant
    id: rads_supply
    entity_id: sensor.mechanical_room_heating_zones_sensors_ee9780_living_room_tanya_alice_bedrooms_radiators_supply
    on_value:
      - lvgl.indicator.update:
          id: n_rads_supply
          value: !lambda return x;
      - lvgl.label.update:
          id: v_rads_supply
          text: !lambda return str_sprintf("%.1f°F", x);

  - platform: homeassistant
    id: rads_return
    entity_id: sensor.mechanical_room_heating_zones_sensors_ee9780_living_room_tanya_alice_bedrooms_radiators_return
    on_value:
      - lvgl.indicator.update:
          id: n_rads_return
          value: !lambda return x;
      - lvgl.label.update:
          id: v_rads_return
          text: !lambda return str_sprintf("%.1f°F", x);

  - platform: homeassistant
    id: outdoor_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: v_outdoor
          text: !lambda return str_sprintf("Outside %.0f°F", x);

  - platform: homeassistant
    id: b1_outdoor
    entity_id: sensor.vitodens_boiler_1_outdoor_temperature
    on_value:
      - lvgl.label.update:
          id: b1_v_outdoor
          text: !lambda return str_sprintf("%.0f°F", x);

  - platform: homeassistant
    id: b1_roomset
    entity_id: sensor.vitodens_boiler_1_room_set_temperature
    on_value:
      - lvgl.label.update:
          id: b1_v_roomset
          text: !lambda return str_sprintf("%.0f°F", x);

  - platform: homeassistant
    id: b1_water
    entity_id: sensor.vitodens_boiler_1_boiler_water_temperature
    on_value:
      - lvgl.label.update:
          id: b1_v_water
          text: !lambda return str_sprintf("%.0f°F", x);

  - platform: homeassistant
    id: b1_modulation
    entity_id: sensor.vitodens_boiler_1_burner_modulation
    on_value:
      - if:
          condition:
            lambda: 'return x > 0;'
          then:
            - lvgl.widget.show: [b1_i_flame, b1_v_mod]
            - lvgl.label.update:
                id: b1_v_mod
                text: !lambda return str_sprintf("%.0f%%", x);
          else:
            - lvgl.widget.hide: [b1_i_flame, b1_v_mod]

text_sensor:
  - platform: homeassistant
    id: b1_mode
    entity_id: sensor.vitodens_boiler_1_operating_mode
    on_value:
      - lvgl.label.update:
          id: b1_v_mode
          text: !lambda return x;
      - if:
          condition:
            lambda: 'return x == "Heating + DHW" || x == "DHW only";'
          then:
            - lvgl.widget.show: b1_i_faucet
          else:
            - lvgl.widget.hide: b1_i_faucet
      - if:
          condition:
            lambda: 'return x == "Heating + DHW";'
          then:
            - lvgl.widget.show: b1_i_radiator
          else:
            - lvgl.widget.hide: b1_i_radiator

  - platform: homeassistant
    id: b1_curmode
    entity_id: sensor.vitodens_boiler_1_current_mode
    on_value:
      - if:
          condition:
            lambda: 'return x == "Normal" || x == "Permanent Normal";'
          then:
            - lvgl.widget.show: b1_i_sun
          else:
            - lvgl.widget.hide: b1_i_sun

binary_sensor:
  - platform: homeassistant
    id: b1_fault
    entity_id: binary_sensor.vitodens_boiler_1_fault
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.show: b1_i_fault
          else:
            - lvgl.widget.hide: b1_i_fault

font:
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf
    id: mdi_48
    size: 48
    bpp: 4
    glyphs:
      - "\U000F1B29"  # faucet
      - "\U000F0438"  # radiator
      - "\U000F05A8"  # sun
      - "\U000F0238"  # fire
      - "\U000F0026"  # alert

lvgl:
  pages:
    - id: main_page
      bg_color: 0x101418
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 300ms
      widgets:
        - label:
            id: clock_label
            align: TOP_RIGHT
            x: -12
            y: 6
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xFFFFFF
        - label:
            id: v_outdoor
            align: TOP_RIGHT
            x: -190
            y: 10
            text: "Outside --"
            text_font: montserrat_24
            text_color: 0xFFFFFF
        - label:
            align: TOP_LEFT
            x: 12
            y: 8
            text: "Bathrooms & Kitchen Floors"
            text_font: montserrat_24
            text_color: 0x7FB3D5

        - meter:
            x: 20
            y: 40
            width: 200
            height: 200
            bg_color: 0x1B2128
            border_color: 0x9AA4AE
            border_width: 3
            scales:
              - range_from: 40
                range_to: 200
                angle_range: 240
                rotation: 150
                ticks:
                  count: 17
                  width: 1
                  length: 6
                  color: 0x9AA4AE
                  major:
                    stride: 4
                    width: 3
                    length: 12
                    color: 0xFFFFFF
                    label_gap: 8
                indicators:
                  - arc: {color: 0x3B82F6, start_value: 40, end_value: 90, width: 8}
                  - arc: {color: 0xF59E0B, start_value: 90, end_value: 110, width: 8}
                  - arc: {color: 0xEF4444, start_value: 110, end_value: 200, width: 8}
                  - line: {id: n_floors_supply, color: 0xFFFFFF, width: 4, value: 40}
            widgets:
              - label: {id: v_floors_supply, align: CENTER, y: 40, text: "--", text_font: montserrat_20, text_color: 0xFFFFFF}
              - label: {align: CENTER, y: 66, text: "Supply", text_font: montserrat_16, text_color: 0x9AA4AE}

        - meter:
