        - label: {id: b1_i_flame, x: 715, y: 270, text: "\U000F0238", text_font: mdi_48, text_color: 0xFFB74D, hidden: true}
        - label: {id: b1_v_mod, x: 700, y: 325, width: 80, text_align: CENTER, text: "", text_font: montserrat_20, text_color: 0xFFB74D, hidden: true}
