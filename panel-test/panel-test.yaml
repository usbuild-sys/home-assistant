        - label: {id: b1_v_outdoor, x: 50, y: 225, width: 300, text_align: CENTER, text: "--", text_font: montserrat_48, text_color: 0xD6E4EE}
        - label: {x: 50, y: 290, width: 300, text_align: CENTER, text: "Outdoor", text_font: montserrat_18, text_color: 0xB4C3CF}
