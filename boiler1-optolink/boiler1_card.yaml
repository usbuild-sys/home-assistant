type: picture-elements
image: "data:image/svg+xml;base64,"
elements:
  - type: conditional
    conditions:
      - entity: sensor.vitodens_boiler_1_operating_mode
        state: "Heating + DHW"
    elements:
      - type: icon
        icon: mdi:faucet
        style: {top: 12%, left: 7%, color: "#d6e4ee", "--mdc-icon-size": 40px}
      - type: icon
        icon: mdi:radiator
        style: {top: 12%, left: 14%, color: "#d6e4ee", "--mdc-icon-size": 40px}
  - type: conditional
    conditions:
      - entity: sensor.vitodens_boiler_1_operating_mode
        state: "DHW only"
    elements:
      - type: icon
        icon: mdi:faucet
        style: {top: 12%, left: 7%, color: "#d6e4ee", "--mdc-icon-size": 40px}
  - type: state-label
    entity: sensor.vitodens_boiler_1_operating_mode
    style: {top: 12%, left: 45%, color: "#d6e4ee", font-size: 22px}
  - type: conditional
    conditions:
      - entity: sensor.vitodens_boiler_1_current_mode
        state: "Normal"
    elements:
      - type: icon
        icon: mdi:white-balance-sunny
        style: {top: 31%, left: 9%, color: "#d6e4ee", "--mdc-icon-size": 48px}
  - type: conditional
    conditions:
      - entity: binary_sensor.vitodens_boiler_1_burner
        state: "on"
    elements:
      - type: icon
        icon: mdi:fire
        style: {top: 66%, left: 92%, color: "#ffb74d", "--mdc-icon-size": 48px}
  - type: conditional
    conditions:
      - entity: binary_sensor.vitodens_boiler_1_fault
        state: "on"
    elements:
      - type: icon
        icon: mdi:alert
        style: {top: 12%, left: 88%, color: "#ef4444", "--mdc-icon-size": 48px}
  - type: state-label
    entity: sensor.vitodens_boiler_1_outdoor_temperature
    style: {top: 55%, left: 25%, color: "#d6e4ee", font-size: 32px}
  - type: state-label
    entity: sensor.vitodens_boiler_1_room_set_temperature
    style: {top: 53%, left: 66%, color: "#d6e4ee", font-size: 40px}
  - type: state-label
    entity: sensor.vitodens_boiler_1_boiler_water_temperature
    style: {top: 87%, left: 85%, color: "#d6e4ee", font-size: 34px, font-weight: bold}
